# Weekly Luanti player activity.
#
# This job does not use the production environment and does not have the
# root deploy key. It plans and applies only linode_firewall.luanti, and only
# when the saved plan's sole change is adding (then removing) the runner's
# SSH /32. The stats user can run one forced command.
#
# The concurrency group is shared with Terraform main so a stats run cannot
# overlap an apply. cancel-in-progress is false so this job cannot abort one.
name: Luanti weekly stats

on:
  schedule:
    # Monday 02:30 UTC. GitHub may start the run later than the clock time.
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luanti-main
  cancel-in-progress: false

jobs:
  stats:
    name: weekly player activity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: luanti-stats
    permissions:
      contents: read
      actions: write
    env:
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      TF_VAR_backups_access_key: ${{ secrets.BACKUPS_ACCESS_KEY }}
      TF_VAR_backups_secret_key: ${{ secrets.BACKUPS_SECRET_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_ENDPOINT_HOST: ${{ vars.TF_STATE_ENDPOINT_HOST }}
      TF_VAR_ci_ssh_cidrs: "[]"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require tokens and stats key
        env:
          STATS_SSH_PRIVATE_KEY: ${{ secrets.STATS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${LINODE_TOKEN:?Set secret LINODE_TOKEN}"
          : "${CLOUDFLARE_API_TOKEN:?Set secret CLOUDFLARE_API_TOKEN}"
          : "${AWS_ACCESS_KEY_ID:?Set secret TF_STATE_ACCESS_KEY}"
          : "${AWS_SECRET_ACCESS_KEY:?Set secret TF_STATE_SECRET_KEY}"
          : "${TF_VAR_backups_access_key:?Set secret BACKUPS_ACCESS_KEY}"
          : "${TF_VAR_backups_secret_key:?Set secret BACKUPS_SECRET_KEY}"
          : "${TF_STATE_BUCKET:?Set variable TF_STATE_BUCKET}"
          : "${TF_STATE_ENDPOINT_HOST:?Set variable TF_STATE_ENDPOINT_HOST}"
          ./scripts/ci-require-stats-key.sh > "$RUNNER_TEMP/stats-user"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Backend config
        run: ./scripts/ci-backend.sh

      - name: Init
        run: terraform -chdir=main init -input=false -backend-config=backend.hcl

      - name: Instance address
        run: |
          set -euo pipefail
          host="$(terraform -chdir=main output -raw ipv4_address | tr -d '[:space:]')"
          python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$host"
          printf '%s\n' "$host" > "$RUNNER_TEMP/instance-ipv4"

      - name: Runner public IPv4
        run: |
          set -euo pipefail
          ipv4="$(curl -4 -fsS --max-time 20 https://api.ipify.org)"
          python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$ipv4"
          printf '%s\n' "$ipv4" > "$RUNNER_TEMP/runner-ipv4"

      - name: Open SSH for this runner
        id: open_ssh
        run: |
          set -euo pipefail
          ipv4="$(tr -d '[:space:]' < "$RUNNER_TEMP/runner-ipv4")"
          ./scripts/ci-firewall-ssh-apply.sh open "$ipv4"

      - name: Collect weekly logs
        env:
          STATS_SSH_PRIVATE_KEY: ${{ secrets.STATS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          key="$RUNNER_TEMP/ssh/id"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$STATS_SSH_PRIVATE_KEY" > "$key"
          chmod 0600 "$key"
          stats_user="$(tr -d '[:space:]' < "$RUNNER_TEMP/stats-user")"
          host="$(tr -d '[:space:]' < "$RUNNER_TEMP/instance-ipv4")"
          if [[ ! "$stats_user" =~ ^[a-z][a-z0-9-]{0,30}$ ]]; then
            echo "refusing unexpected stats user" >&2
            exit 1
          fi
          python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$host"
          # No remote command. authorized_keys forces luanti-weekly-logs.
          timeout 120 ssh \
            -i "$key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=30 \
            -o PreferredAuthentications=publickey \
            -o LogLevel=ERROR \
            "${stats_user}@${host}" \
            > "$RUNNER_TEMP/luanti-week.log"

      - name: Summarize
        run: |
          set -euo pipefail
          python3 scripts/luanti-weekly-stats.py \
            --input "$RUNNER_TEMP/luanti-week.log" \
            --output "$RUNNER_TEMP/luanti-weekly-stats.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload weekly stats
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luanti-weekly-stats
          path: ${{ runner.temp }}/luanti-weekly-stats.json
          retention-days: 30
          if-no-files-found: error

      - name: Close temporary SSH
        if: always() && steps.open_ssh.outcome != 'skipped'
        run: |
          set -euo pipefail
          ipv4="$(tr -d '[:space:]' < "$RUNNER_TEMP/runner-ipv4")"
          ./scripts/ci-firewall-ssh-apply.sh close "$ipv4"
