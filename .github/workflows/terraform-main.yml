# Plan main/ on pull requests and apply it on main after a production approval.
#
# Temporary SSH: GitHub-hosted runner addresses change every job. The apply
# step sets ci_ssh_cidrs to that runner's /32 so this Terraform run can push
# config. A later step in the same job applies the firewall again with
# ci_ssh_cidrs empty, including when the apply fails or is cancelled.
# That second apply is targeted at the firewall, so it does not SSH and it
# leaves state matching the committed (empty) list instead of an out-of-band
# Linode rule Terraform would otherwise fight.
name: Terraform main

on:
  pull_request:
    paths:
      - "main/**"
      - ".github/workflows/terraform-main.yml"
      - "scripts/validate.sh"
      - "scripts/render-configs.sh"
      - "scripts/ci-backend.sh"
      - "scripts/ci-require-deploy-key.sh"
      - "scripts/ci-plan-is-redacted.py"
  push:
    branches:
      - main
    paths:
      - "main/**"
      - ".github/workflows/terraform-main.yml"
      - "scripts/validate.sh"
      - "scripts/render-configs.sh"
      - "scripts/ci-backend.sh"
      - "scripts/ci-require-deploy-key.sh"
      - "scripts/ci-plan-is-redacted.py"

permissions:
  contents: read

# One group for plans and applies. There is no remote state lock.
# cancel-in-progress is false so a new push cannot abort an apply.
concurrency:
  group: luanti-main
  cancel-in-progress: false

jobs:
  validate:
    name: fmt and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Validate
        run: ./scripts/validate.sh

  plan:
    name: plan
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      TF_VAR_backups_access_key: ${{ secrets.BACKUPS_ACCESS_KEY }}
      TF_VAR_backups_secret_key: ${{ secrets.BACKUPS_SECRET_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_ENDPOINT_HOST: ${{ vars.TF_STATE_ENDPOINT_HOST }}
      TF_VAR_ci_ssh_cidrs: "[]"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Require tokens
        run: |
          set -euo pipefail
          : "${LINODE_TOKEN:?Set secret LINODE_TOKEN}"
          : "${CLOUDFLARE_API_TOKEN:?Set secret CLOUDFLARE_API_TOKEN}"
          : "${TF_VAR_backups_access_key:?Set secret BACKUPS_ACCESS_KEY}"
          : "${TF_VAR_backups_secret_key:?Set secret BACKUPS_SECRET_KEY}"
      - name: Backend config
        run: ./scripts/ci-backend.sh
      - name: Init
        run: terraform -chdir=main init -input=false -backend-config=backend.hcl
      - name: Plan
        run: |
          set -euo pipefail
          terraform -chdir=main plan -input=false -no-color -out=tfplan
          terraform -chdir=main show -no-color tfplan > "$RUNNER_TEMP/plan.txt"
          rm -f main/tfplan
          python3 scripts/ci-plan-is-redacted.py "$RUNNER_TEMP/plan.txt"
      - name: Comment on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_PATH: ${{ runner.temp }}/plan.txt
        with:
          script: |
            const fs = require("fs")
            const marker = "<!-- luanti-terraform-plan -->"
            const raw = fs.readFileSync(process.env.PLAN_PATH, "utf8")
            const max = 50000
            let plan = raw
            let note = ""
            if (plan.length > max) {
              plan = plan.slice(0, max)
              note = "\n\n_Plan truncated to fit the comment limit. The full plan is in the workflow log._"
            }
            plan = plan.split("````").join("'''")
            const body = [
              marker,
              "#### Terraform plan (`main/`)",
              "",
              `Commit \`${context.sha}\`. Sensitive values are redacted. This plan does not include a CI runner SSH rule.`,
              "",
              "<details><summary>Show plan</summary>",
              "",
              "````",
              plan,
              "````",
              note,
              "</details>",
              "",
            ].join("\n")
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.body &&
              comment.body.startsWith(marker) &&
              comment.user &&
              comment.user.type === "Bot"
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }

  apply:
    name: apply
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
    env:
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      TF_VAR_backups_access_key: ${{ secrets.BACKUPS_ACCESS_KEY }}
      TF_VAR_backups_secret_key: ${{ secrets.BACKUPS_SECRET_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_ENDPOINT_HOST: ${{ vars.TF_STATE_ENDPOINT_HOST }}
      TF_VAR_ci_ssh_cidrs: "[]"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Require deploy key and tokens
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${LINODE_TOKEN:?Set secret LINODE_TOKEN}"
          : "${CLOUDFLARE_API_TOKEN:?Set secret CLOUDFLARE_API_TOKEN}"
          : "${TF_VAR_backups_access_key:?Set secret BACKUPS_ACCESS_KEY}"
          : "${TF_VAR_backups_secret_key:?Set secret BACKUPS_SECRET_KEY}"
          ./scripts/ci-require-deploy-key.sh
      - name: Backend config
        run: ./scripts/ci-backend.sh
      - name: Init
        run: terraform -chdir=main init -input=false -backend-config=backend.hcl
      - name: Runner public IPv4
        run: |
          set -euo pipefail
          ipv4="$(curl -4 -fsS --max-time 20 https://api.ipify.org)"
          python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$ipv4"
          printf '%s\n' "$ipv4" > "$RUNNER_TEMP/runner-ipv4"
      - name: Terraform apply
        id: apply
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ipv4="$(cat "$RUNNER_TEMP/runner-ipv4")"
          python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$ipv4"
          export TF_VAR_ci_ssh_cidrs="[\"${ipv4}/32\"]"
          export TF_VAR_admin_ssh_private_key="$DEPLOY_SSH_PRIVATE_KEY"
          terraform -chdir=main apply -input=false -auto-approve -no-color
      - name: Close temporary SSH
        if: always() && steps.apply.outcome != 'skipped'
        run: |
          set -euo pipefail
          export TF_VAR_ci_ssh_cidrs="[]"
          unset TF_VAR_admin_ssh_private_key || true
          terraform -chdir=main apply -input=false -auto-approve -no-color -target=linode_firewall.luanti
